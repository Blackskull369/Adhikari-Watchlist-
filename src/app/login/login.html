<div class="login-wrapper">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <div class="logo"><mat-icon>movie</mat-icon></div>
      <mat-card-title>Welcome back</mat-card-title>
      <mat-card-subtitle>Sign in to your movie watchlist</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Email</mat-label>
        <input matInput type="email" placeholder="you@example.com" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Password</mat-label>
        <input matInput type="password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-flat-button color="primary" class="full" routerLink="/dashboard">Login</button>
    </mat-card-actions>
  </mat-card>
</div>
