<h1 class="title">Dashboard</h1>

<div class="stats-grid">
  @for (s of stats; track s.label) {
    <mat-card appearance="outlined" class="stat-card">
      <div class="stat-icon" [style.background]="s.color">
        <mat-icon>{{ s.icon }}</mat-icon>
      </div>
      <div>
        <div class="stat-value">{{ s.value }}</div>
        <div class="stat-label">{{ s.label }}</div>
      </div>
    </mat-card>
  }
</div>

<div class="two-col">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Movies by Genre</mat-card-title>
      <mat-card-subtitle>Chart.js will replace this later</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="chart">
        @for (b of chartBars; track b.label) {
          <div class="bar-col">
            <div class="bar" [style.height.%]="b.height"></div>
            <span>{{ b.label }}</span>
          </div>
        }
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Recently Added</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        @for (m of recent; track m.title) {
          <mat-list-item>
            <mat-icon matListItemIcon>movie</mat-icon>
            <span matListItemTitle>{{ m.title }}</span>
            <span matListItemLine>{{ m.year }} · {{ m.source }}</span>
          </mat-list-item>
        }
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
